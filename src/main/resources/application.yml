spring:
  application:
    name: ragchat
  datasource:
    url: jdbc:postgresql://localhost:5432/ragchat
    username: ragchat_user
    password: ragchat_pass
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
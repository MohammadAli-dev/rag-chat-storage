spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragchat
    username: ragchat_user
    password: ragchat_pass
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

app:
  security:
    api-key: test-api-key

server:
  port: 8082
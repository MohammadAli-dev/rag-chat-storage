services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragchat-app
    environment:
      SPRING_APPLICATION_NAME: ragchat
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ragchat
      SPRING_DATASOURCE_USERNAME: ragchat_user
      SPRING_DATASOURCE_PASSWORD: ragchat_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SERVER_PORT: 8082
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      APP_SECURITY_API_KEY: my-secret-key
      APP_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE: 100
      APP_CORS_ALLOWED_ORIGINS: "*"
      APP_CORS_ALLOWED_METHODS: GET,POST,PATCH,DELETE,OPTIONS
      APP_CORS_ALLOWED_HEADERS: "*"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: ragchat-postgres
    environment:
      POSTGRES_DB: ragchat
      POSTGRES_USER: ragchat_user
      POSTGRES_PASSWORD: ragchat_pass
    ports:
      - "5432:5432"
    volumes:
      - ragchat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat_user -d ragchat"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: ragchat-adminer
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ragchat_data:

openapi: 3.0.3
info:
  title: RAG Chat Storage API
  version: 1.0.0

paths:

  /api/v1/sessions:
    post:
      summary: Create a new chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                title:
                  type: string
      responses:
        "201":
          description: Session created
        "400":
          description: Bad request

    get:
      summary: List all sessions for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sessions

  /api/v1/sessions/{id}:
    get:
      summary: Get a session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session found
        "404":
          description: Session not found

    delete:
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /api/v1/sessions/{id}/rename:
    patch:
      summary: Rename a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        "200":
          description: Renamed
        "404":
          description: Not found

  /api/v1/sessions/{id}/favorite:
    patch:
      summary: Toggle favorite on a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favorite toggled

  /api/v1/sessions/{id}/messages:
    post:
      summary: Add a message to a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sender:
                  type: string
                  enum: [USER, BOT]
                content:
                  type: string
                context:
                  type: string
      responses:
        "201":
          description: Message added
        "404":
          description: Session not found

    get:
      summary: Get messages for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of messages

  /actuator/health:
    get:
      summary: Health check
      responses:
        "200":
          description: App is healthy